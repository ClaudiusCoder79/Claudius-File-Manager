name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release with this version (e.g. 1.0.0). Leave empty for a test build.'
        required: false
        default: ''

permissions:
  contents: write   # needed to publish releases on tags

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # A Release is published when:
      #   - a tag like v1.2.0 is pushed, or
      #   - a commit to main says "release v1.2.0" in its message, or
      #   - the workflow is run by hand (Actions > Build > Run workflow) with a version filled in.
      # Every other build is a test build numbered 1.0.<run>.
      - name: Work out version
        id: ver
        shell: pwsh
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          INPUT_RELEASE: ${{ github.event.inputs.release }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $v = "1.0.$env:RUN_NUMBER"; $release = "false"
          if ($env:REF -like "refs/tags/v*") {
            $v = $env:REF_NAME.TrimStart('v'); $release = "true"
          } elseif ($env:INPUT_RELEASE -match '^v?(\d+\.\d+\.\d+)$') {
            $v = $Matches[1]; $release = "true"
          } elseif ($env:REF -eq "refs/heads/main" -and $env:COMMIT_MSG -match '(?im)^\s*release v(\d+\.\d+\.\d+)\s*$') {
            $v = $Matches[1]; $release = "true"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v (release: $release)"

      - name: Publish single-file exe (win-x64)
        run: >
          dotnet publish src/ClaudiusFileManager/ClaudiusFileManager.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer\ClaudiusFileManager.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: ClaudiusFileManager-${{ steps.ver.outputs.version }}-portable
          path: publish/ClaudiusFileManager.exe
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ClaudiusFileManager-Setup-${{ steps.ver.outputs.version }}
          path: installer-output/*.exe
          if-no-files-found: error

      - name: Create GitHub release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Claudius File Manager ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            installer-output/ClaudiusFileManager-Setup-${{ steps.ver.outputs.version }}.exe
            publish/ClaudiusFileManager.exe
          generate_release_notes: true
